{{define "content"}}
<section class="card errorpage">
  <div class="errorpage__code">{{.ErrorCode}}</div>
  <div class="errorpage__copy">
    <p class="eyebrow">Request failed</p>
    <h2>{{.ErrorTitle}}</h2>
    <p class="muted">{{.ErrorDetail}}</p>
    <div class="row row--gap">
      <a class="btn btn--primary" href="/">Back to dashboard</a>
      <a class="btn btn--ghost" href="/tools">Browse tools</a>
    </div>
  </div>
</section>
{{end}}
