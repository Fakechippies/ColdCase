name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign checksums with Ed25519
        run: |
          if [ -z "$COLDCASE_SIGNING_KEY" ]; then
            echo "::warning::COLDCASE_SIGNING_KEY secret is not set; the release is UNSIGNED."
            echo "Set the secret (hex of a 64-byte Ed25519 private key) to enable signed releases." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          go run ./cmd/coldcase-sign sign dist/checksums.txt | tee dist/signing-public-key.txt
          gh release upload "${{ github.ref_name }}" dist/checksums.txt.sig
          echo "Release public key:" >> "$GITHUB_STEP_SUMMARY"
          tail -1 dist/signing-public-key.txt >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLDCASE_SIGNING_KEY: ${{ secrets.COLDCASE_SIGNING_KEY }}
