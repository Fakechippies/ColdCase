name: "User story"
description: "As a <role>, I want <goal> so that <benefit>"
labels: ["user-story"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: One sentence, role → goal → benefit.
      placeholder: "As an investigator, I want <goal> so that <benefit>"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI (tool execution)
        - Web console
        - Sessions / chain of custody
        - Signing & cryptography
        - Container runtime
        - Tool catalog
        - CI/CD & release
        - Docs & onboarding
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable, concrete, testable.
      placeholder: |
        - [ ] Given <context>, when <action>, then <observable result>
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes / constraints
      description: Design notes, security constraints, links, screenshots.

  - type: checkboxes
    id: dod
    attributes:
      label: Definition of Done (summary)
      description: The full list is in docs/DEFINITION_OF_DONE.md.
      options:
        - label: Tests written and passing
        - label: Lint clean (or justified)
        - label: PR opened, CI green
        - label: Docs/changelog updated
